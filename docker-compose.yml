services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roxwood_network_entreprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-roxwood_network_entreprise}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roxwood_network_entreprise}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      DEV_GUILD_ID: ${DEV_GUILD_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER:-roxwood_network_entreprise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-roxwood_network_entreprise}
      CDN_TOKEN: ${CDN_TOKEN}
    # Limite volontairement large pour un bot Discord de cette taille : protege le VPS entier
    # (partage avec d'autres services) contre une fuite memoire du bot, sans le faire tomber
    # dans des conditions normales d'usage.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
